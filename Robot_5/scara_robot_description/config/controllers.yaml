controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scara_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

scara_arm_controller:
  ros__parameters:
    joints:
      - Union_1_joint
      - union_2_joint
      - prismatic_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      Union_1_joint:
        trajectory: 0.1
        goal: 0.05
      union_2_joint:
        trajectory: 0.1
        goal: 0.05
      prismatic_joint:
        trajectory: 0.1
        goal: 0.05
